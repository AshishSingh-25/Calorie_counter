<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body style="background-color: aliceblue;">
    <h1 style="color: rgb(55, 9, 98);">Nutritional Facts</h1>
    <hr>
    <div class="container">
        <table>
            <tr style="background-color: rgb(136, 208, 196); color: rgb(32, 45, 57);">
                <th>Food Item</th>
                <th>Carbohydrate</th>
                <th>Protein</th>
                <th>Fats</th>
                <th>Calories</th>
            </tr>
            {% for food in food_list %}
                <tr style="background-color: rgb(188, 245, 235); color: rgb(32, 45, 57);" align="center">
                    <td style="background-color: rgb(136, 208, 196); color: rgb(32, 45, 57);" align="left"><b>{{food.name}}</b></td>
                    <td>{{food.carbs}}</td>
                    <td>{{food.protein}}</td>
                    <td>{{food.fats}}</td>
                    <td>{{food.calories}}</td>
                </tr>
            {% endfor %} 
        </table>
    </div>
</body>
</html>
